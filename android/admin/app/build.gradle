plugins {
    id 'com.android.application'
}

def apiUrl = System.getenv("ASHUR_API_URL") ?: ""
def keystoreFilePath = System.getenv("ASHUR_KEYSTORE_FILE") ?: ""
def keystorePassword = System.getenv("ASHUR_KEYSTORE_PASSWORD") ?: ""
def keyAliasName = System.getenv("ASHUR_KEY_ALIAS") ?: ""
def keyPasswordValue = System.getenv("ASHUR_KEY_PASSWORD") ?: ""
def hasReleaseSigning = keystoreFilePath && keystorePassword && keyAliasName && keyPasswordValue && file(keystoreFilePath).exists()

android {
    namespace 'app.ashur.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'app.ashur.admin'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        buildConfigField "String", "ASHUR_API_URL", '"' + apiUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreFilePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}

tasks.register("syncWebAssets", Copy) {
    from "../../../apps/admin-web"
    into "src/main/assets/www"
}
tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
