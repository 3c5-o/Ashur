name: بناء Release المستخدم غير الموقعة

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-user-release-unsigned.yml"
      - "android/user/**"
      - "apps/user-web/**"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد نود
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تجهيز مكتبة Supabase المحلية
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p apps/user-web/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js apps/user-web/vendor/supabase.min.js
          test -s apps/user-web/vendor/supabase.min.js

      - name: إعداد جافا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت حزم أندرويد
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: بناء Release غير موقعة
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ASHUR_REQUIRE_RELEASE_SIGNING: "false"
        run: gradle -p android/user :app:assembleRelease --stacktrace

      - name: التحقق من ملف Release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/user/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -n "$APK" && test -s "$APK"
          echo "APK=$APK"
          sha256sum "$APK"

      - name: حفظ Release غير الموقعة
        uses: actions/upload-artifact@v4
        with:
          name: ashur-user-release-unsigned-1.6.1
          path: android/user/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
