plugins {
    id 'com.android.application'
}

def apiUrl = System.getenv("ASHUR_API_URL") ?: ""

android {
    namespace 'app.ashur.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'app.ashur.admin'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField "String", "ASHUR_API_URL", '"' + apiUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}

tasks.register("syncWebAssets", Copy) {
    from "../../../apps/admin-web"
    into "src/main/assets/www"
}
tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
