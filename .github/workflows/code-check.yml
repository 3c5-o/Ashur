name: فحص كود آشور

on:
  push:
    branches: [main, feature/ashur-1.2-full-build]
    paths:
      - "apps/**/*.js"
      - "apps/**/*.html"
      - "apps/**/*.css"
      - "services/**/*.mjs"
      - "android/user/app/src/main/java/**/*.java"
      - "android/admin/app/src/main/java/**/*.java"
      - ".github/workflows/code-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    name: فحص ملفات جافاسكربت
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد نود
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: فحص نسخة المستخدم
        run: |
          node --check apps/user-web/core.js
          node --check apps/user-web/auth-core.js
          node --check apps/user-web/profile-core.js
          node --check apps/user-web/app.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          global.window = global;
          vm.runInThisContext(fs.readFileSync('apps/user-web/auth-core.js','utf8'));
          vm.runInThisContext(fs.readFileSync('apps/user-web/profile-core.js','utf8'));
          if (!global.AshurAuth.validEmail('User@Example.com')) throw new Error('auth email validator failed');
          if (global.AshurAuth.normalizeEmail(' User@Example.com ') !== 'user@example.com') throw new Error('auth email normalization failed');
          if (!global.AshurAuth.validUsername('ashur_123')) throw new Error('auth username validator failed');
          if (global.AshurAuth.validPassword('1234567')) throw new Error('auth password validator failed');
          const signup = global.AshurAuth.parseAuthLink('ashur://reset-password?flow=signup#access_token=a&refresh_token=b&type=signup');
          if (signup.flow !== 'signup' || signup.accessToken !== 'a' || signup.refreshToken !== 'b') throw new Error('auth signup link parser failed');
          const recovery = global.AshurAuth.parseAuthLink('ashur://reset-password#access_token=a&refresh_token=b&type=recovery');
          if (recovery.flow !== 'recovery') throw new Error('auth recovery link parser failed');
          const profile = global.AshurProfile.validateProfile({
            name:' حمد  النزار ',
            username:'ASHUR_123',
            bio:'نبذة',
            profile_link:'example.com/user',
            is_private:true
          });
          if (!profile.ok || profile.value.username !== 'ashur_123' || profile.value.name !== 'حمد النزار') throw new Error('profile normalization failed');
          if (!profile.value.profile_link.startsWith('https://')) throw new Error('profile link normalization failed');
          if (global.AshurProfile.validateImageFile({type:'application/pdf',size:10}).ok) throw new Error('profile image validation failed');
          NODE
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('apps/user-web/app.js','utf8');
          const index = fs.readFileSync('apps/user-web/index.html','utf8');
          const style = fs.readFileSync('apps/user-web/style.css','utf8');
          const core = fs.readFileSync('apps/user-web/core.js','utf8');
          const authCore = fs.readFileSync('apps/user-web/auth-core.js','utf8');
          const profileCore = fs.readFileSync('apps/user-web/profile-core.js','utf8');
          const server = fs.readFileSync('services/api/src/server.mjs','utf8');
          const manifest = fs.readFileSync('android/user/app/src/main/AndroidManifest.xml','utf8');
          const main = fs.readFileSync('android/user/app/src/main/java/app/ashur/social/MainActivity.java','utf8');
          const directSingleForEach = /(^|[^$])\$\((?:"[^"]*"|'[^']*')\)\.forEach/g.test(app);
          const triple = app.includes('$' + '$' + '$' + '(');
          const remoteUi = /REMOTE_APP_URL|vercel\.app\/app/.test(main);
          const missingBack = !app.includes('window.ASHUR_HANDLE_BACK');
          const missingLocal = !main.includes('LOCAL_APP_URL');
          const runtimeCdn = /cdn\.jsdelivr\.net|unpkg\.com/i.test(index);
          const missingLocalVendor = !index.includes('./vendor/supabase.min.js');
          const missingCore = !index.includes('./core.js') || !core.includes('createStore') || !core.includes('createRouter');
          const appNotUsingCore = !app.includes('AshurCore.createStore') || !app.includes('AshurCore.createRouter');
          const missingAuthCore = !index.includes('./auth-core.js') || !authCore.includes('parseAuthLink') || !authCore.includes('errorMessage');
          const unsafeUrlDetection = app.includes('detectSessionInUrl: true');
          const missingAuthReady = !main.includes('void authReady()') || !app.includes('AshurNative?.authReady');
          const missingSingleTask = !manifest.includes('android:launchMode="singleTask"');
          const missingLocalLogout = !app.includes('signOut({scope:"local"})');
          const missingProfileCore = !index.includes('./profile-core.js') || !profileCore.includes('validateProfile') || !app.includes('window.AshurProfile');
          const missingProfileMediaGuard = !server.includes('detectProfileImageMime') || !server.includes('kind === "profile_cover"');
          const missingDeleteRevocation = !server.includes('/auth/v1/logout?scope=global');
          const missingInteractionLocks = !app.includes('interactionLocks:new Set()') || !app.includes('ASHUR_LIKE_TOGGLE_FAILED');
          const missingReelPagination = !app.includes('reelOffset:0') || !app.includes('loadReels({append=false}') || !app.includes('loadReels({append:true})');
          const missingStoryViewersApi = !app.includes('/v1/social/story-viewers/') || !server.includes('async function socialStoryViewers');
          const missingMediaVisibilityScan = !server.includes('for (const link of links)') || !server.includes('for (const reel of reels || [])');
          const missingCommentFeedback = !index.includes('id="commentMessage"') || !app.includes('$("#commentMessage")');
          const missingMessageIdempotency = !server.includes('client_message_id') || !app.includes('pendingChatSendId');
          const missingMessageApiRead = !server.includes('async function listConversationMessages') || !app.includes('/messages");');
          const missingMessagingRealtime = !app.includes('subscribeChatRealtime') || !app.includes('subscribeInboxRealtime') || !app.includes('CHANNEL_ERROR');
          const missingChatStatus = !index.includes('id="chatConnectionStatus"') || !index.includes('id="chatMessage"');
          const directMessageWrites = app.includes('client.from("messages").insert') || app.includes('client.from("message_reads").insert');
          const missingAudioNative = !manifest.includes('android.permission.RECORD_AUDIO') || !main.includes('onPermissionRequest(PermissionRequest request)');
          const missingConversationSoftDelete = !server.includes('is_deleted=eq.false') || !server.includes('direct_key');
          const missingCameraNative = !manifest.includes('android.permission.CAMERA') || !main.includes('RESOURCE_VIDEO_CAPTURE') || !main.includes('hasCameraPermission()');
          const missingCameraStudio = !index.includes('id="cameraStudioDialog"') || !app.includes('startCameraStream') || !app.includes('captureCameraPhoto') || !app.includes('startCameraRecording');
          const missingMediaViewer = !index.includes('id="mediaViewerDialog"') || !app.includes('enhanceVideoPlayer') || !app.includes('enhanceAudioPlayer') || !app.includes('openMediaViewer');
          const missingReelViews = !app.includes('recordReelView') || !app.includes('data-reel-view-count') || !server.includes('socialRecordReelView') || !server.includes('/rest/v1/rpc/record_reel_view');
          const missingDoubleTapLike = !app.includes('showReelLikeBurst') || !app.includes('reel-like-burst');
          const missingPostPins = !app.includes('pinOwnContent') || !app.includes('profile-grid-pinned') || !server.includes('existingPinned >= 3');
          const missingCommentPins = !app.includes('data-pin-comment') || !server.includes('socialPinComment') || !server.includes('commentPinMatch');
          const missingMentionDelivery = !server.includes('ensureMentionDirectConversation') || !server.includes('content_mentions') || !server.includes('ذكرتك في هذا المنشور');
          const missingCombinedProfileCount = !app.includes('const totalContent=Number(posts||0)+Number(reels||0)');
          const missingStage4IdentityRules = !authCore.includes('^[a-z0-9_.]{2,10}$') || !profileCore.includes('value.name.length > 30') || !profileCore.includes('value.bio.length > 150');
          const missingRegistrationAvatar = !index.includes('id="registerAvatar"') || !app.includes('savePendingRegistrationAvatar') || !app.includes('applyPendingRegistrationAvatar');
          const missingDesignedConfirm = !index.includes('id="confirmDialog"') || !app.includes('function confirmAction') || !app.includes('حذف حساب آشور؟');
          const missingStage4Search = !index.includes('id="clearSearchButton"') || !app.includes('search-account-card') || !app.includes('data-search-open-post');
          const missingFollowActions = !app.includes('followListActionLabel') || !server.includes('viewer_status') || !server.includes('follows_viewer');
          const missingStage5Composer = !app.includes('composer-video-frame') || !app.includes('setComposerOverallProgress') || !app.includes('composerPublishing');
          const composerLeaksFilename = app.includes('files[0].name+" · "') || app.includes('"الملف "+file.name');
          const missingStage5Topbar = !app.includes('labels={') || !app.includes('topbar.dataset.page');
          const missingStage5SearchLayout = !style.includes('#searchPage .section-head.sticky-head') || !style.includes('top:calc(58px + var(--safe-top))');
          const missingStage5FileMetaHide = !style.includes('.composer-file-meta{display:none!important}');
          const missingStage6IncrementalChat = !app.includes('reconcileChatMessages') || !app.includes('appendRealtimeMessage') || !app.includes('chatMessageCache:new Map()');
          const stage6FullChatRerender = app.includes('$("#chatMessages").innerHTML=html');
          const stage6AggressivePoll = app.includes('},15000);');
          const missingStage6ImmediateSend = !app.includes('await appendRealtimeMessage({...sent,conversation_id:sent.conversation_id||conversationId})');
          const missingStage6MediaUi = !style.includes('ASHUR messaging stability/media stage 6') || !style.includes('.message-row .ashur-video-player') || !style.includes('.message-row .ashur-audio-player');
          const stage6FilenameLeak = app.includes('access.original_name||"صوتية"') || app.includes('link.textContent=access.original_name');
          const missingStage7Drafts = !app.includes('ashur_composer_drafts_v1') || !app.includes('restoreComposerDraft') || !app.includes('saveComposerDraft') || !app.includes('deleteComposerDraft');
          const missingStage7ExitGuard = !app.includes('تم حفظ عملك كمسودة على هذا الجهاز') || !app.includes('composerHasDraftContent');
          const missingStage7AudienceEdit = !app.includes('id="ownContentVisibility"') || !app.includes('body.visibility=$("#ownContentVisibility"') || !app.includes('data-preview-visibility');
          const missingStage7CommentLock = !app.includes('التعليقات مغلقة لهذا المحتوى') || !app.includes('.select("author_id,comments_enabled")');


          if (directSingleForEach || triple || remoteUi || missingBack || missingLocal || runtimeCdn || missingLocalVendor || missingCore || appNotUsingCore || missingAuthCore || unsafeUrlDetection || missingAuthReady || missingSingleTask || missingLocalLogout || missingProfileCore || missingProfileMediaGuard || missingDeleteRevocation || missingInteractionLocks || missingReelPagination || missingStoryViewersApi || missingMediaVisibilityScan || missingCommentFeedback || missingMessageIdempotency || missingMessageApiRead || missingMessagingRealtime || missingChatStatus || directMessageWrites || missingAudioNative || missingConversationSoftDelete || missingCameraNative || missingCameraStudio || missingMediaViewer || missingReelViews || missingDoubleTapLike || missingPostPins || missingCommentPins || missingMentionDelivery || missingCombinedProfileCount || missingStage4IdentityRules || missingRegistrationAvatar || missingDesignedConfirm || missingStage4Search || missingFollowActions || missingStage5Composer || composerLeaksFilename || missingStage5Topbar || missingStage5SearchLayout || missingStage5FileMetaHide || missingStage6IncrementalChat || stage6FullChatRerender || stage6AggressivePoll || missingStage6ImmediateSend || missingStage6MediaUi || stage6FilenameLeak || missingStage7Drafts || missingStage7ExitGuard || missingStage7AudienceEdit || missingStage7CommentLock) {
            console.error({directSingleForEach,triple,remoteUi,missingBack,missingLocal,runtimeCdn,missingLocalVendor,missingCore,appNotUsingCore,missingAuthCore,unsafeUrlDetection,missingAuthReady,missingSingleTask,missingLocalLogout,missingProfileCore,missingProfileMediaGuard,missingDeleteRevocation,missingInteractionLocks,missingReelPagination,missingStoryViewersApi,missingMediaVisibilityScan,missingCommentFeedback,missingMessageIdempotency,missingMessageApiRead,missingMessagingRealtime,missingChatStatus,directMessageWrites,missingAudioNative,missingConversationSoftDelete,missingCameraNative,missingCameraStudio,missingMediaViewer,missingReelViews,missingDoubleTapLike,missingPostPins,missingCommentPins,missingMentionDelivery,missingCombinedProfileCount,missingStage4IdentityRules,missingRegistrationAvatar,missingDesignedConfirm,missingStage4Search,missingFollowActions,missingStage5Composer,composerLeaksFilename,missingStage5Topbar,missingStage5SearchLayout,missingStage5FileMetaHide,missingStage6IncrementalChat,stage6FullChatRerender,stage6AggressivePoll,missingStage6ImmediateSend,missingStage6MediaUi,stage6FilenameLeak,missingStage7Drafts,missingStage7ExitGuard,missingStage7AudienceEdit,missingStage7CommentLock});
            process.exit(1);
          }
          NODE

      - name: فحص نسخة الإدارة
        run: |
          node --check apps/admin-web/app.js
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('apps/admin-web/app.js','utf8');
          const index=fs.readFileSync('apps/admin-web/index.html','utf8');
          const adminStyle=fs.readFileSync('apps/admin-web/style.css','utf8');
          const userApp=fs.readFileSync('apps/user-web/app.js','utf8');
          const userStyle=fs.readFileSync('apps/user-web/style.css','utf8');
          const stage78Migration=fs.readFileSync('docs/migrations/2026-09-29-admin-stages7-8.sql','utf8');
          const stage910Migration=fs.readFileSync('docs/migrations/2026-09-29-admin-stages9-10.sql','utf8');
          const stage1112Migration=fs.readFileSync('docs/migrations/2026-09-29-admin-stages11-12.sql','utf8');
          const stage1314Migration=fs.readFileSync('docs/migrations/2026-09-29-admin-stages13-14.sql','utf8');
          const siteApp=fs.readFileSync('apps/site/app.js','utf8');
          const siteIndex=fs.readFileSync('apps/site/index.html','utf8');
          const server=fs.readFileSync('services/api/src/server.mjs','utf8');
          const telegram=fs.readFileSync('services/api/src/telegram.mjs','utf8');
          const failures={
            directSingleForEach:/(^|[^$])\$\((?:"[^"]*"|'[^']*')\)\.forEach/g.test(app),
            missingUserPagination:!index.includes('id="usersPager"')||!app.includes('userPage=1'),
            missingUserActions:!app.includes('force_logout')||!app.includes('deleteUserPermanently')||!app.includes('data-ban-hours'),
            missingWarningHistory:!server.includes('admin_user_warnings')||!app.includes('warning-history'),
            missingContentFilters:!index.includes('id="contentVisibility"')||!index.includes('id="contentReports"')||!index.includes('id="contentFrom"'),
            missingContentPreview:!index.includes('id="contentPreviewDialog"')||!app.includes('openContentPreview'),
            missingCommentPagination:!index.includes('id="commentsPager"')||!app.includes('commentsPage=1'),
            missingCleanupQueue:!server.includes('media_cleanup_jobs')||!server.includes('processMediaCleanupJobs'),
            missingTelegramDelete:!telegram.includes('deleteChannelMessage')||!server.includes('purgeMediaObject'),
            missingSessionRevoke:!server.includes('admin_revoke_user_sessions'),
            missingStage5ReportsLayout:!index.includes('id="reportDetail"')||!index.includes('id="reportsPager"')||!index.includes('id="reportPriority"'),
            missingStage5ReportsApi:!server.includes('async function adminReportDetail')||!server.includes('report_events')||!server.includes('reportTargetSnapshot')||!server.includes('deleteReportedTarget'),
            missingStage5ReportsActions:!app.includes('openReportDetail')||!app.includes('data-report-ban-hours')||!app.includes('reportDeleteTarget')||!app.includes('reportToggleHidden'),
            missingStage5ReportsStyle:!adminStyle.includes('Ashur Admin stages 5-6')||!adminStyle.includes('.report-target-gallery')||!adminStyle.includes('.stage56-timeline'),
            missingStage6SupportLayout:!index.includes('id="supportDetail"')||!index.includes('id="supportPager"')||!index.includes('id="supportUnread"'),
            missingStage6SupportApi:!server.includes('async function socialSupportDetail')||!server.includes('async function socialSupportReply')||!server.includes('async function adminSupportDetail')||!server.includes('support_messages')||!server.includes('support_events'),
            missingStage6SupportAdminUi:!app.includes('openSupportDetail')||!app.includes('support-thread-message')||!app.includes('supportSendReply'),
            missingStage6SupportUserUi:!userApp.includes('openSupportCenter(initialTicketId')||!userApp.includes('user-support-thread')||!userApp.includes('/v1/social/support/"+encodeURIComponent(ticketId)'),
            missingStage6SupportStyle:!userStyle.includes('Ashur threaded support stage 6')||!userStyle.includes('.user-support-message'),
            missingStage7AdminSearch:!index.includes('id="adminCandidateSearch"')||!app.includes('/v1/admin/admin-candidates')||!server.includes('async function adminCandidates'),
            missingStage7Permissions:!app.includes('effective_permissions')||!app.includes('collectPermissionOverrides')||!server.includes('sanitizeAdminPermissions')||!server.includes('effectiveAdminPermissions'),
            missingStage7SectionGuard:!app.includes('pagePermission')||!app.includes('permission-hidden')||!app.includes('adminCanPage'),
            missingStage7Style:!adminStyle.includes('.stage7-admin-card')||!adminStyle.includes('.stage7-permission-row')||!adminStyle.includes('.stage7-candidate'),
            missingStage7TempBanProtection:!server.includes('temporarilyBanned')||!server.includes('is_banned,banned_until,deleted_at'),
            missingStage8StorageHealth:!index.includes('id="storageSummary"')||!app.includes('testAllChannels')||!server.includes('async function adminTestAllChannels')||!server.includes('files_count,bytes_total'),
            missingStage8StorageState:!server.includes('async function testStorageChannel(channel, force = false)')||!server.includes('status: "disabled"')||!server.includes('status: "checking"'),
            missingStage8Style:!adminStyle.includes('.stage8-summary')||!adminStyle.includes('.stage8-channel-card')||!adminStyle.includes('.stage8-upload-card'),
            missingStage8UploadLive:!index.includes('id="uploadsPager"')||!app.includes('uploadsLiveTimer')||!app.includes('data-retry-upload')||!server.includes('async function adminRetryUpload'),
            missingStage8RetryCache:!server.includes('retryUploadCachePath')||!server.includes('retry_available')||!server.includes('failure_stage'),
            missingStage8TelegramCleanup:!server.includes('deleteChannelMessage({ channelId: channel.channel_id, messageId: telegramUpload.messageId })')||!server.includes('deleteChannelMessage({ channelId: channel.channel_id, messageId: uploaded.messageId })'),
            missingStage8Migration:!stage78Migration.includes("'checking'")||!stage78Migration.includes('refresh_storage_channel_counters')||!stage78Migration.includes('revoke all on function private.refresh_storage_channel_counters() from public'),
            missingStage9ErrorsLayout:!index.includes('id="errorSummary"')||!index.includes('id="errorSeverity"')||!index.includes('id="errorsPager"'),
            missingStage9ErrorsApi:!server.includes('occurrence_count')||!server.includes('fingerprint')||!server.includes('async function adminSystemHealth')||!server.includes('/v1/admin/system/health'),
            missingStage9Style:!adminStyle.includes('.stage9-summary')||!adminStyle.includes('.stage9-error-card')||!adminStyle.includes('.stage9-queues'),
            missingStage9Migration:!stage910Migration.includes('occurrence_count')||!stage910Migration.includes('admin_notification_templates'),
            missingStage10NotificationLayout:!index.includes('id="notificationRecipientPreview"')||!index.includes('id="notificationTemplates"')||!index.includes('id="notificationHistoryPager"'),
            missingStage10NotificationApi:!server.includes('async function adminNotificationPreview')||!server.includes('async function adminNotificationTemplates')||!server.includes('async function cancelScheduledAdminNotification')||!server.includes('async function resendAdminNotification'),
            missingStage10NotificationUi:!app.includes('selectedNotificationUsers')||!app.includes('loadNotificationTemplates')||!app.includes('editingScheduledNotificationId'),
            missingStage10Style:!adminStyle.includes('.stage10-layout')||!adminStyle.includes('.stage10-user-picker')||!adminStyle.includes('.stage10-template-card'),
            missingStage11ReleaseLayout:!index.includes('id="releaseSha256"')||!index.includes('id="releaseUpdateMessage"')||!index.includes('id="currentPublishedRelease"'),
            missingStage11ReleaseApi:!server.includes('async function syncPublishedRelease')||!server.includes('update_message')||!server.includes('sha256')||!server.includes('publish_release'),
            missingStage11ReleaseUi:!app.includes('editingReleaseId')||!app.includes('data-release-publish')||!app.includes('releaseCancelEdit'),
            missingStage11Style:!adminStyle.includes('.stage11-summary')||!adminStyle.includes('.stage11-release-card')||!adminStyle.includes('.stage11-current-release'),
            missingStage12SettingsLayout:!index.includes('id="maintenanceStartAt"')||!index.includes('id="maintenanceEndAt"')||!index.includes('id="limitReel"')||!index.includes('id="settingsHistory"'),
            missingStage12SettingsApi:!server.includes('async function appSettingsHistory')||!server.includes('async function restoreAppSettings')||!server.includes('saveAppSettingsSnapshot')||!server.includes('requireFeature'),
            missingStage12SettingsUi:!app.includes('loadSettingsHistory')||!app.includes('maintenanceActiveNow')||!app.includes('appSettingsReason'),
            missingStage12UserRuntime:!userApp.includes('maintenanceIsActive')||!userApp.includes('runtimeFeatureEnabled')||!userApp.includes('runtimeUploadLimitMb')||!userApp.includes('reel_mb'),
            missingStage12Style:!adminStyle.includes('.stage12-summary')||!adminStyle.includes('.stage12-feature-grid')||!adminStyle.includes('.stage12-history-card'),
            missingStage1112Migration:!stage1112Migration.includes('app_settings_history')||!stage1112Migration.includes('update_message')||!stage1112Migration.includes('sha256'),
            missingStage13SiteLayout:!index.includes('id="siteSettingsSummary"')||!index.includes('id="siteFeatureEditor"')||!index.includes('id="siteSupportUrl"')||!index.includes('id="siteSha256"'),
            missingStage13SiteApi:!server.includes('update_site_settings')||!server.includes('["hero", "download", "features", "update", "support", "legal"]'),
            missingStage13SiteUi:!app.includes('collectSiteFeatures')||!app.includes('siteFeatureTitle')||!app.includes('sitePrivacyUrl'),
            missingStage13SiteRuntime:!siteIndex.includes('id="siteFeaturesGrid"')||!siteIndex.includes('id="siteUpdateNote"')||!siteApp.includes('site_settings')||!siteApp.includes('privacy_url'),
            missingStage13Style:!adminStyle.includes('.stage13-summary')||!adminStyle.includes('.stage13-feature-row'),
            missingStage14AuditLayout:!index.includes('id="auditSummary"')||!index.includes('id="auditRole"')||!index.includes('id="auditPager"'),
            missingStage14AuditApi:!server.includes('actor_role')||!server.includes('async function adminAudit(req, res, url)')||!server.includes('append_only: true'),
            missingStage14AuditUi:!app.includes('auditSensitive')||!app.includes('auditDetailsMarkup')||!app.includes('adminSensitiveConfirm'),
            missingStage14Style:!adminStyle.includes('.stage14-summary')||!adminStyle.includes('.stage14-audit-card')||!adminStyle.includes('.stage14-details'),
            missingStage1314Migration:!stage1314Migration.includes('prevent_audit_log_delete')||!stage1314Migration.includes('actor_role')||!stage1314Migration.includes("'features'"),
            missingAdminA14Revision:(server.match(/admin_revision: "A14"/g)||[]).length<2||server.includes('admin_revision: "A10"'),
            missingDeletedChatMediaGuard:!server.includes('media_id=eq.\${encodeURIComponent(media.id)}&is_deleted=eq.false')
          };
          if(Object.values(failures).some(Boolean)){
            console.error('Admin stage 3-14 guard failed',failures);
            process.exit(1);
          }
          NODE

      - name: فحص الموقع
        run: node --check apps/site/app.js

      - name: فحص بوابة آشور
        run: |
          node --check services/api/src/config.mjs
          node --check services/api/src/supabase.mjs
          node --check services/api/src/telegram.mjs
          node --check services/api/src/onesignal.mjs
          node --check services/api/src/server.mjs

      - name: فحص بوت التخزين
        run: node --check services/bot/src/bot.mjs
