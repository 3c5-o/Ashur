name: تحقق API الإدارة A4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-api-a4.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: انتظار نشر Railway والتحقق
        shell: bash
        run: |
          set -euo pipefail
          URL="https://exciting-miracle-production-b2cf.up.railway.app/health"
          for i in $(seq 1 24); do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q '"admin_revision":"A4"'; then
              echo "Ashur API A4 is live"
              exit 0
            fi
            sleep 10
          done
          echo "Ashur API A4 did not become ready in time" >&2
          exit 1
