plugins {
    id 'com.android.application'
}

def apiUrl = System.getenv("ASHUR_API_URL") ?: "https://exciting-miracle-production-b2cf.up.railway.app"
def oneSignalAppId = System.getenv("ONESIGNAL_APP_ID") ?: "5248cf60-522b-48cd-b539-fdd631014c94"
def keystoreFilePath = System.getenv("ASHUR_KEYSTORE_FILE") ?: ""
def keystorePassword = System.getenv("ASHUR_KEYSTORE_PASSWORD") ?: ""
def keyAliasName = System.getenv("ASHUR_KEY_ALIAS") ?: ""
def keyPasswordValue = System.getenv("ASHUR_KEY_PASSWORD") ?: ""
def hasReleaseSigning = keystoreFilePath && keystorePassword && keyAliasName && keyPasswordValue && file(keystoreFilePath).exists()
def requireReleaseSigning = (System.getenv("ASHUR_REQUIRE_RELEASE_SIGNING") ?: "false").toBoolean()

android {
    namespace 'app.ashur.social'
    compileSdk 36

    defaultConfig {
        applicationId 'app.ashur.social'
        minSdk 24
        targetSdk 36
        versionCode 18
        versionName '2.0.0'

        buildConfigField "String", "ASHUR_API_URL", '"' + apiUrl + '"'
        buildConfigField "String", "ONESIGNAL_APP_ID", '"' + oneSignalAppId + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreFilePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (requireReleaseSigning) {
                throw new GradleException("توقيع Release الرسمي مطلوب لكنه غير متوفر")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'com.onesignal:OneSignal:5.10.2'
}

tasks.register("prepareSupabaseVendor") {
    doLast {
        def vendorFile = file("../../../apps/user-web/vendor/supabase.min.js")
        def packageVendor = file("../../../node_modules/@supabase/supabase-js/dist/umd/supabase.js")
        if ((!vendorFile.exists() || vendorFile.length() < 50000) && packageVendor.exists()) {
            vendorFile.parentFile.mkdirs()
            copy {
                from packageVendor
                into vendorFile.parentFile
            }
        }
        if (!vendorFile.exists() || vendorFile.length() < 50000) {
            throw new GradleException("ملف Supabase المحلي مفقود. نفّذ npm install قبل بناء التطبيق.")
        }
    }
}

tasks.register("syncWebAssets", Copy) {
    from "../../../apps/user-web"
    into "src/main/assets/www"
}
tasks.named("syncWebAssets").configure {
    dependsOn("prepareSupabaseVendor")
}
tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}

if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}
