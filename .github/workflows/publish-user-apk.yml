name: نشر APK المستخدم على موقع آشور

on:
  push:
    branches: [main]
    paths:
      - "publish-user-apk.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: التحقق من أسرار التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.ASHUR_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ASHUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASHUR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ASHUR_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

      - name: إعداد نود
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تجهيز مكتبة Supabase المحلية
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p apps/user-web/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js apps/user-web/vendor/supabase.min.js
          test -s apps/user-web/vendor/supabase.min.js

      - name: إعداد جافا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت حزم أندرويد
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: تجهيز مفتاح التوقيع الثابت
        env:
          KEYSTORE_B64: ${{ secrets.ASHUR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ashur-release.jks"
          chmod 600 "$RUNNER_TEMP/ashur-release.jks"

      - name: بناء نسخة المستخدم الرسمية الموقعة
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ASHUR_KEYSTORE_FILE: ${{ runner.temp }}/ashur-release.jks
          ASHUR_KEYSTORE_PASSWORD: ${{ secrets.ASHUR_KEYSTORE_PASSWORD }}
          ASHUR_KEY_ALIAS: ${{ secrets.ASHUR_KEY_ALIAS }}
          ASHUR_KEY_PASSWORD: ${{ secrets.ASHUR_KEY_PASSWORD }}
          ASHUR_REQUIRE_RELEASE_SIGNING: "true"
        run: gradle -p android/user :app:assembleRelease --stacktrace

      - name: التحقق من التوقيع
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/user/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -n "$APK" && test -s "$APK"
          VERIFY="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$VERIFY" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          CERT_SHA256="$(echo "$VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          test -n "$CERT_SHA256"
          echo "Signing certificate SHA-256: $CERT_SHA256"
          sha256sum "$APK"

      - name: وضع APK الموقع داخل الموقع
        shell: bash
        run: |
          mkdir -p apps/site/download
          APK="$(find android/user/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          cp "$APK" apps/site/download/ASHUR-User-latest.apk

      - name: رفع APK للمستودع
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < publish-user-apk.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/site/download/ASHUR-User-latest.apk
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير"
            exit 0
          fi
          git commit -m "نشر APK المستخدم $VERSION [skip ci]"
          git push
