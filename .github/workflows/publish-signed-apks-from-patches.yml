name: نشر نسخ آشور الموقعة من patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-signed-apks-from-patches.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تنزيل Release المستخدم غير الموقعة
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36494294934
          name: ashur-user-release-unsigned-1.5.0
          path: /tmp/ashur-user

      - name: تنزيل Release الأدمن غير الموقعة
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36495006056
          name: ashur-admin-release-unsigned-1.2.0
          path: /tmp/ashur-admin

      - name: إعادة تكوين APK المستخدم الموقعة
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patch-user
          USER_BASE="$(find /tmp/ashur-user -type f -name '*.apk' | head -n1)"
          test -n "$USER_BASE" && test -s "$USER_BASE"
          cp "$USER_BASE" /tmp/patch-user/base.apk
          : > /tmp/user-signing.patch
          FIRST=1
          for PART in .github/signing-patches/user.part*; do
            if [ "$FIRST" -eq 0 ]; then printf '\n' >> /tmp/user-signing.patch; fi
            cat "$PART" >> /tmp/user-signing.patch
            FIRST=0
          done
          printf '\n' >> /tmp/user-signing.patch
          (
            cd /tmp/patch-user
            git init -q
            git add base.apk
            git apply --binary /tmp/user-signing.patch
          )
          echo "616bf456196b0431b29663484753cb1db0938b7a93276426e42070f1d3bcc03c  /tmp/patch-user/signed.apk" | sha256sum -c -
          USER_CERT="$(keytool -printcert -jarfile /tmp/patch-user/signed.apk 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test "$USER_CERT" = "3B:9C:DD:06:F5:34:CB:8A:0F:D9:1A:FE:0A:45:76:E2:75:A9:AD:71:35:39:5E:0F:22:BF:E7:CD:79:89:02:9B"

      - name: إعادة تكوين APK الأدمن الموقعة
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patch-admin
          ADMIN_BASE="$(find /tmp/ashur-admin -type f -name '*.apk' | head -n1)"
          test -n "$ADMIN_BASE" && test -s "$ADMIN_BASE"
          cp "$ADMIN_BASE" /tmp/patch-admin/base.apk
          cat .github/signing-patches/admin.part* > /tmp/admin-signing.patch
          printf '\n' >> /tmp/admin-signing.patch
          (
            cd /tmp/patch-admin
            git init -q
            git add base.apk
            git apply --binary /tmp/admin-signing.patch
          )
          echo "4d9357e9c25d94548fd1079ffa3a9956eed63fd5954e8829723e69b6aab52af0  /tmp/patch-admin/signed.apk" | sha256sum -c -
          ADMIN_CERT="$(keytool -printcert -jarfile /tmp/patch-admin/signed.apk 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test "$ADMIN_CERT" = "3B:9C:DD:06:F5:34:CB:8A:0F:D9:1A:FE:0A:45:76:E2:75:A9:AD:71:35:39:5E:0F:22:BF:E7:CD:79:89:02:9B"

      - name: وضع النسخ في مجلد التحميل
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/site/download
          cp /tmp/patch-user/signed.apk apps/site/download/ASHUR-User-latest.apk
          cp /tmp/patch-admin/signed.apk apps/site/download/ASHUR-Admin-latest.apk
          sha256sum apps/site/download/ASHUR-User-latest.apk apps/site/download/ASHUR-Admin-latest.apk

      - name: نشر النسختين الموقعتين
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ashur Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/site/download/ASHUR-User-latest.apk apps/site/download/ASHUR-Admin-latest.apk
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة للنشر"
            exit 0
          fi
          git commit -m "Publish signed Ashur user 1.5.0 and admin 1.2.0 [skip ci]"
          git push

# retry-final-newline
