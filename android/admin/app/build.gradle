plugins {
    id 'com.android.application'
}

def apiUrl = System.getenv("ASHUR_API_URL") ?: ""
def keystoreFilePath = System.getenv("ASHUR_KEYSTORE_FILE") ?: ""
def keystorePassword = System.getenv("ASHUR_KEYSTORE_PASSWORD") ?: ""
def keyAliasName = System.getenv("ASHUR_KEY_ALIAS") ?: ""
def keyPasswordValue = System.getenv("ASHUR_KEY_PASSWORD") ?: ""
def hasReleaseSigning = keystoreFilePath && keystorePassword && keyAliasName && keyPasswordValue && file(keystoreFilePath).exists()
def requireReleaseSigning = (System.getenv("ASHUR_REQUIRE_RELEASE_SIGNING") ?: "false").toBoolean()

android {
    namespace 'app.ashur.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'app.ashur.admin'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.3.2'
        buildConfigField "String", "ASHUR_API_URL", '"' + apiUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreFilePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (requireReleaseSigning) {
                throw new GradleException("توقيع Release الرسمي مطلوب لكنه غير متوفر")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.core:core:1.17.0'
}

tasks.register("prepareSupabaseVendor") {
    doLast {
        def vendorFile = file("../../../apps/admin-web/vendor/supabase.min.js")
        def packageVendor = file("../../../node_modules/@supabase/supabase-js/dist/umd/supabase.js")
        if ((!vendorFile.exists() || vendorFile.length() < 50000) && packageVendor.exists()) {
            vendorFile.parentFile.mkdirs()
            copy {
                from packageVendor
                into vendorFile.parentFile
                rename { "supabase.min.js" }
            }
        }
        if (!vendorFile.exists() || vendorFile.length() < 50000) {
            throw new GradleException("ملف Supabase المحلي مفقود. نفّذ npm install قبل بناء تطبيق الإدارة.")
        }
    }
}

tasks.register("syncWebAssets", Copy) {
    from "../../../apps/admin-web"
    into "src/main/assets/www"
}
tasks.named("syncWebAssets").configure {
    dependsOn("prepareSupabaseVendor")
}
tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
