name: بناء تطبيقات آشور

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "apps/user-web/**"
      - "apps/admin-web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: بناء ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: android/user
            name: نسخة المستخدم
            artifact: ashur-user
          - path: android/admin
            name: نسخة الإدارة
            artifact: ashur-admin

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد أندرويد
        uses: android-actions/setup-android@v3

      - name: تثبيت حزمة أندرويد
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: إعداد أداة البناء
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: بناء نسخة الاختبار
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: gradle -p ${{ matrix.path }} :app:assembleDebug --stacktrace

      - name: حفظ ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
