name: بناء تطبيقات آشور

on:
  push:
    branches: [main, feature/ashur-1.2-full-build]
    paths:
      - "android/**"
      - "apps/user-web/**"
      - "apps/admin-web/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: بناء ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: android/user
            name: نسخة المستخدم
            artifact: ashur-user
          - path: android/admin
            name: نسخة الإدارة
            artifact: ashur-admin

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد نود
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تجهيز مكتبة Supabase محليًا داخل APK
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p apps/user-web/vendor apps/admin-web/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js apps/user-web/vendor/supabase.min.js
          cp apps/user-web/vendor/supabase.min.js apps/admin-web/vendor/supabase.min.js
          test -s apps/user-web/vendor/supabase.min.js
          test -s apps/admin-web/vendor/supabase.min.js

      - name: إعداد جافا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت حزم أندرويد المطلوبة
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد أداة البناء
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: بناء نسخة الاختبار
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: gradle -p ${{ matrix.path }} :app:assembleDebug --stacktrace

      - name: حفظ ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
