name: إصدار آشور الرسمي

on:
  push:
    branches: [main]
    paths:
      - "release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: قراءة رقم الإصدار
        id: version
        shell: bash
        run: |
          VERSION="$(cat release-trigger.txt | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "رقم الإصدار مفقود"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: التحقق من أسرار التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.ASHUR_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ASHUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASHUR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ASHUR_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || (echo "ASHUR_KEYSTORE_BASE64 غير موجود" && exit 1)
          test -n "$STORE_PASS" || (echo "ASHUR_KEYSTORE_PASSWORD غير موجود" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ASHUR_KEY_ALIAS غير موجود" && exit 1)
          test -n "$KEY_PASS" || (echo "ASHUR_KEY_PASSWORD غير موجود" && exit 1)

      - name: إعداد نود
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تجهيز مكتبة Supabase المحلية
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p apps/user-web/vendor apps/admin-web/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js apps/user-web/vendor/supabase.min.js
          cp apps/user-web/vendor/supabase.min.js apps/admin-web/vendor/supabase.min.js
          test -s apps/user-web/vendor/supabase.min.js
          test -s apps/admin-web/vendor/supabase.min.js

      - name: إعداد جافا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت حزم أندرويد
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.ASHUR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ashur-release.jks"
          chmod 600 "$RUNNER_TEMP/ashur-release.jks"

      - name: بناء نسخة المستخدم الرسمية
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ASHUR_KEYSTORE_FILE: ${{ runner.temp }}/ashur-release.jks
          ASHUR_KEYSTORE_PASSWORD: ${{ secrets.ASHUR_KEYSTORE_PASSWORD }}
          ASHUR_KEY_ALIAS: ${{ secrets.ASHUR_KEY_ALIAS }}
          ASHUR_KEY_PASSWORD: ${{ secrets.ASHUR_KEY_PASSWORD }}
          ASHUR_REQUIRE_RELEASE_SIGNING: "true"
        run: gradle -p android/user :app:assembleRelease --stacktrace

      - name: بناء نسخة الإدارة الرسمية
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ASHUR_KEYSTORE_FILE: ${{ runner.temp }}/ashur-release.jks
          ASHUR_KEYSTORE_PASSWORD: ${{ secrets.ASHUR_KEYSTORE_PASSWORD }}
          ASHUR_KEY_ALIAS: ${{ secrets.ASHUR_KEY_ALIAS }}
          ASHUR_KEY_PASSWORD: ${{ secrets.ASHUR_KEY_PASSWORD }}
          ASHUR_REQUIRE_RELEASE_SIGNING: "true"
        run: gradle -p android/admin :app:assembleRelease --stacktrace

      - name: قراءة إصدارات التطبيقين
        id: app_versions
        shell: bash
        run: |
          USER_VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/user/app/build.gradle | head -n1)"
          ADMIN_VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/admin/app/build.gradle | head -n1)"
          test -n "$USER_VERSION"
          test -n "$ADMIN_VERSION"
          echo "user_version=$USER_VERSION" >> "$GITHUB_OUTPUT"
          echo "admin_version=$ADMIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: التحقق الصارم من توقيع APK الرسمي
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          USER_APK="$(find android/user/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          ADMIN_APK="$(find android/admin/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -n "$USER_APK" && test -s "$USER_APK"
          test -n "$ADMIN_APK" && test -s "$ADMIN_APK"

          USER_VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$USER_APK")"
          ADMIN_VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$ADMIN_APK")"
          echo "$USER_VERIFY"
          echo "$ADMIN_VERIFY"

          echo "$USER_VERIFY" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$USER_VERIFY" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          echo "$ADMIN_VERIFY" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$ADMIN_VERIFY" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"

          USER_CERT="$(echo "$USER_VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          ADMIN_CERT="$(echo "$ADMIN_VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          test -n "$USER_CERT"
          test -n "$ADMIN_CERT"
          test "$USER_CERT" = "$ADMIN_CERT"
          echo "Signing certificate SHA-256: $USER_CERT"

          sha256sum "$USER_APK" "$ADMIN_APK"

      - name: تجهيز ملفات الإصدار
        shell: bash
        run: |
          mkdir -p release
          USER_APK="$(find android/user/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          ADMIN_APK="$(find android/admin/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          cp "$USER_APK" "release/ASHUR-User-v${{ steps.app_versions.outputs.user_version }}.apk"
          cp "$ADMIN_APK" "release/ASHUR-Admin-v${{ steps.app_versions.outputs.admin_version }}.apk"

      - name: إنشاء إصدار GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "آشور User ${{ steps.app_versions.outputs.user_version }} · Admin ${{ steps.app_versions.outputs.admin_version }}"
          generate_release_notes: true
          files: |
            release/ASHUR-User-v${{ steps.app_versions.outputs.user_version }}.apk
            release/ASHUR-Admin-v${{ steps.app_versions.outputs.admin_version }}.apk
