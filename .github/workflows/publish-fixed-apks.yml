name: نشر نسخ آشور المصححة V2 V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-fixed-apks.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تنزيل Release المستخدم غير الموقعة
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36494294934
          name: ashur-user-release-unsigned-1.5.0
          path: /tmp/user

      - name: تنزيل Release الأدمن غير الموقعة
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36495006056
          name: ashur-admin-release-unsigned-1.2.0
          path: /tmp/admin

      - name: تثبيت apksigner الرسمي
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: إعادة تكوين APK المستخدم المصححة
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fix-user
          USER_BASE="$(find /tmp/user -type f -name '*.apk' | head -n1)"
          test -n "$USER_BASE" && test -s "$USER_BASE"
          cp "$USER_BASE" /tmp/fix-user/app.apk
          (
            cd /tmp/fix-user
            git init -q
            git add app.apk
            git apply --binary "$GITHUB_WORKSPACE/.github/signing-fixes/user-apksigner.patch"
          )
          echo "f205e00d4d511a105380efbd4cae46792b8c1b4d2ca1b4b69cce87d53e00017c  /tmp/fix-user/app.apk" | sha256sum -c -
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"; fi
          "$APKSIGNER" verify --verbose --print-certs /tmp/fix-user/app.apk | tee /tmp/user-verify.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/user-verify.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/user-verify.txt
          grep -Fi "3b9cdd06f534cb8a0fd91afe0a4576e275a9ad7135395e0f22bfe7cd7989029b" /tmp/user-verify.txt

      - name: إعادة تكوين APK الأدمن المصححة
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fix-admin
          ADMIN_BASE="$(find /tmp/admin -type f -name '*.apk' | head -n1)"
          test -n "$ADMIN_BASE" && test -s "$ADMIN_BASE"
          cp "$ADMIN_BASE" /tmp/fix-admin/app.apk
          (
            cd /tmp/fix-admin
            git init -q
            git add app.apk
            git apply --binary "$GITHUB_WORKSPACE/.github/signing-fixes/admin-apksigner.patch"
          )
          echo "19dc94e80d2eafef31a5c04792b70fdb4696afc102705c09395985d8e51e0f39  /tmp/fix-admin/app.apk" | sha256sum -c -
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"; fi
          "$APKSIGNER" verify --verbose --print-certs /tmp/fix-admin/app.apk | tee /tmp/admin-verify.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/admin-verify.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/admin-verify.txt
          grep -Fi "3b9cdd06f534cb8a0fd91afe0a4576e275a9ad7135395e0f22bfe7cd7989029b" /tmp/admin-verify.txt

      - name: استبدال ملفات التحميل
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/site/download
          cp /tmp/fix-user/app.apk apps/site/download/ASHUR-User-latest.apk
          cp /tmp/fix-admin/app.apk apps/site/download/ASHUR-Admin-latest.apk
          sha256sum apps/site/download/ASHUR-User-latest.apk apps/site/download/ASHUR-Admin-latest.apk

      - name: رفع النسختين المصححتين
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ashur Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/site/download/ASHUR-User-latest.apk apps/site/download/ASHUR-Admin-latest.apk
          git commit -m "Fix APK signing: publish V2/V3 signed user and admin [skip ci]"
          git push
