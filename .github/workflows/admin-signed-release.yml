name: إصدار إدارة آشور الموقعة

on:
  push:
    branches: [main]
    paths:
      - "admin-release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-admin:
    runs-on: ubuntu-24.04
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: قراءة إصدار الإدارة
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/admin/app/build.gradle | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: التحقق من أسرار توقيع الإدارة
        env:
          KEYSTORE_B64: ${{ secrets.ASHUR_ADMIN_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ASHUR_ADMIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASHUR_ADMIN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ASHUR_ADMIN_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

      - name: إعداد Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تجهيز مكتبة Supabase المحلية
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p apps/admin-web/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js apps/admin-web/vendor/supabase.min.js
          test -s apps/admin-web/vendor/supabase.min.js

      - name: إعداد جافا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت أدوات Android
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: تجهيز مفتاح الإدارة
        env:
          KEYSTORE_B64: ${{ secrets.ASHUR_ADMIN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ashur-admin-release.jks"
          chmod 600 "$RUNNER_TEMP/ashur-admin-release.jks"

      - name: بناء Admin Release الموقعة
        env:
          ASHUR_API_URL: ${{ vars.ASHUR_API_URL }}
          ASHUR_KEYSTORE_FILE: ${{ runner.temp }}/ashur-admin-release.jks
          ASHUR_KEYSTORE_PASSWORD: ${{ secrets.ASHUR_ADMIN_KEYSTORE_PASSWORD }}
          ASHUR_KEY_ALIAS: ${{ secrets.ASHUR_ADMIN_KEY_ALIAS }}
          ASHUR_KEY_PASSWORD: ${{ secrets.ASHUR_ADMIN_KEY_PASSWORD }}
          ASHUR_REQUIRE_RELEASE_SIGNING: "true"
        run: gradle -p android/admin :app:assembleRelease --stacktrace

      - name: التحقق من التوقيع والبصمة
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="$(find android/admin/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          VERIFY="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          CERT="$(echo "$VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "59E717D4967D903E99B900F837562F316E13C21ACF07CAC51587CE655D286AC7"
          sha256sum "$APK"

      - name: تجهيز APK
        shell: bash
        run: |
          mkdir -p release
          APK="$(find android/admin/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          cp "$APK" "release/ASHUR-Admin-v${{ steps.version.outputs.version }}.apk"

      - name: إنشاء إصدار الإدارة
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v${{ steps.version.outputs.version }}
          name: "Ashur Admin ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/ASHUR-Admin-v${{ steps.version.outputs.version }}.apk
